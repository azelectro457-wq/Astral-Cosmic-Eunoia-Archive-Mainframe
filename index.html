<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: #f0f6fc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      width: 350px;
      max-width: 92%;
    }

    .logo {
      text-align: center;
      font-size: 42px;
      margin-bottom: 20px;
    }

    h2 {
      text-align: center;
      font-size: 24px;
      font-weight: 400;
      margin-bottom: 25px;
    }

    .login-box {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 16px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: white;
      font-size: 14px;
    }

    input:focus {
      outline: 2px solid #1f6feb;
      outline-offset: 1px;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #238636;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #2ea043;
    }

    .signup {
      margin-top: 16px;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 16px;
      text-align: center;
      font-size: 14px;
    }

    a {
      color: #4493f8;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .footer {
      text-align: center;
      margin-top: 35px;
      font-size: 12px;
      color: #9198a1;
    }

    .footer a {
      margin: 0 6px;
    }
  </style>
</head>

<body>
  <div class="login-container">
    <div class="logo">◉</div>

    <h2>Sign in to GitHub</h2>

    <form class="login-box" id="loginForm">
      <label for="username">Username or email address</label>
      <input
        type="text"
        id="username"
        placeholder="Enter username or email"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter password"
        autocomplete="current-password"
        required
      >

      <button type="submit">Sign in</button>
      <p id="message" role="status"></p>
    </form>

    <div class="signup">
      New to GitHub?
      <a href="https://github.com/signup">
        Create an account
      </a>
    </div>

    <div class="footer">
      <a href="https://docs.github.com/">Help</a>
      <a href="https://github.com/contact">Contact</a>
      <a href="https://github.com/site/terms">Terms</a>
      <a href="https://github.com/site/privacy">Privacy</a>
    </div>
  </div>

  <script>
    document.getElementById("loginForm")
      .addEventListener("submit", function(event) {
        event.preventDefault();

        document.getElementById("message").textContent =
          "Demo only: connect a secure authentication service to sign in.";
      });
  </script>
</body>
</html>
