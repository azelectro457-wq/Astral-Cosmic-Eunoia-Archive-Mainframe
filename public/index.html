
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in with GitHub</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="login-card">
    <div class="brand-mark" aria-hidden="true">●</div>
    <h1>GitHub Dashboard</h1>
    <p class="muted">
      Sign in to view your GitHub profile and repositories.
    </p>

    <a class="button github-button" href="/auth/github">
      <span aria-hidden="true">↗</span>
      Continue with GitHub
    </a>

    <p id="error" class="error" role="status" hidden></p>

    <p class="fine-print">
      You'll authorize access through GitHub.
      Your GitHub password is never entered on this website.
    </p>
  </main>

  <script src="/login.js"></script>
</body>
</html>
